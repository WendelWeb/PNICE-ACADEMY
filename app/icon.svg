<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PNICE Academy">
  <!-- The PNICE 'PA' wax-seal mark (Stage 8 — launch hygiene): paper ground,
       a filled ochre seal, ink monogram — the brand's Sceau motif redrawn
       filled (not outlined) so it still reads at 16px. -->
  <rect width="64" height="64" rx="12" fill="#EDE6D6"/>
  <circle cx="32" cy="32" r="27" fill="#D98E2B"/>
  <circle cx="32" cy="32" r="21.5" fill="none" stroke="#10204A" stroke-width="1.1" opacity="0.32"/>
  <text
    x="32"
    y="41.5"
    text-anchor="middle"
    font-family="Impact, 'Arial Narrow Bold', 'Arial Black', sans-serif"
    font-weight="700"
    font-size="25"
    letter-spacing="-0.5"
    fill="#10204A"
  >PA</text>
</svg>
